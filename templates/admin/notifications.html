{% extends 'base_admin.html' %}
{% block content %}
<div class="container mt-4">
  <h3>Announcements</h3>

  <!-- Post new -->
  <div class="card p-3 mb-4">
    <form method="POST">
      <input type="text" name="title"
             class="form-control mb-2"
             placeholder="Notification title" required>
      <textarea name="message" class="form-control mb-2"
                rows="3"
                placeholder="Write your message..." required></textarea>
      <button type="submit" class="btn btn-dark">Post Notification</button>
    </form>
  </div>

  <!-- Existing notifications -->
  {% for notif in notifications %}
  <div class="notif-card mb-2">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <p class="notif-title">{{ notif.title }}</p>
        <p class="notif-msg">{{ notif.message }}</p>
        <span class="notif-date">{{ notif.created_at.strftime('%d %b %Y') }}</span>
      </div>
      <form action="{{ url_for('delete_notification', notif_id=notif.id) }}"
            method="POST">
        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
      </form>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
