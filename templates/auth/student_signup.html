{% extends 'base_student.html' %}
{% block title %}Student Signup{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh;">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Register with your college credentials.</p>

    {% if error %}
      <p class="error-msg">{{ error }}</p>
    {% endif %}

    <form method="POST">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="text" name="roll_number" placeholder="Roll Number" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="btn-student">Sign Up</button>
    </form>

    <p class="switch-link">Already registered? <a href="/student/login">Login</a></p>
  </div>
</div>


{% endblock %}
